server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # User Service Route
            - id: user-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

              filters:
                - StripPrefix=1

            # Order Service Route
            - id: order-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**

              filters:
                - StripPrefix=1

            # Payment Service Route
            - id: payment-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**

              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG